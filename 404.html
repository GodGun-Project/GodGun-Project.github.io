<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · 虚空裂隙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0b0d15;
            --surface: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.05);
            --text: #f0ece4;
            --muted: rgba(255, 255, 255, 0.3);
            --gold: #d9c6a9;
            --cyan: #8cd4e8;
            --rose: #e0b0b0;
            --radius: 32px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 10px;
        }

        #particles, #flowField {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        #flowField {
            opacity: 0.3;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 32px;
            flex: 1;
        }

        .navbar {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(11, 13, 21, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 80px;
            padding: 10px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 48px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .navbar .logo {
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: var(--text);
            text-decoration: none;
        }
        .navbar .logo span {
            color: var(--gold);
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }
        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            transition: color 0.3s;
            font-weight: 300;
        }
        .nav-links a:hover {
            color: #fff;
        }

        .main-404 {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            text-align: center;
            padding: 140px 24px 60px;
            background: radial-gradient(ellipse at 50% 30%, rgba(217, 198, 169, 0.05), transparent 60%),
                        radial-gradient(ellipse at 20% 70%, rgba(140, 212, 232, 0.03), transparent 50%),
                        var(--bg);
        }

        .main-404 .code {
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 200;
            line-height: 0.9;
            background: linear-gradient(135deg, var(--gold) 20%, var(--cyan) 60%, var(--rose) 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 80px rgba(217, 198, 169, 0.08));
            margin-bottom: 12px;
        }

        .main-404 .title {
            font-size: clamp(1.8rem, 4vw, 3.2rem);
            font-weight: 200;
            color: #fff;
            letter-spacing: 0.06em;
            margin-bottom: 12px;
        }

        .main-404 .desc {
            font-size: clamp(1rem, 1.4vw, 1.3rem);
            color: var(--muted);
            max-width: 560px;
            font-weight: 300;
            letter-spacing: 0.04em;
            line-height: 1.8;
            margin-bottom: 32px;
        }
        .main-404 .desc mark {
            background: rgba(217, 198, 169, 0.08);
            color: var(--gold);
            padding: 0 6px;
            border-radius: 4px;
        }

        .coordinates {
            font-family: 'Georgia', serif;
            font-size: 0.9rem;
            color: var(--gold);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 8px 24px;
            display: inline-block;
            margin-bottom: 28px;
            letter-spacing: 0.08em;
            backdrop-filter: blur(4px);
            cursor: pointer;
            transition: 0.3s;
            user-select: none;
        }
        .coordinates:hover, .coordinates:focus {
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(217, 198, 169, 0.1);
            outline: none;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 14px 44px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            border: none;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(4px);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: var(--gold);
            color: #0b0d15;
            box-shadow: 0 8px 30px rgba(217, 198, 169, 0.12);
        }
        .btn-primary:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 40px rgba(217, 198, 169, 0.2);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: #fff;
        }
        .btn-secondary:hover {
            border-color: var(--gold);
            background: rgba(217, 198, 169, 0.04);
        }
        .btn-echo {
            background: rgba(140, 212, 232, 0.06);
            border: 1px solid rgba(140, 212, 232, 0.15);
            color: var(--cyan);
        }
        .btn-echo:hover {
            background: rgba(140, 212, 232, 0.12);
            border-color: var(--cyan);
            box-shadow: 0 0 30px rgba(140, 212, 232, 0.05);
        }

        /* ===== 迷失之卷 ===== */
        .scroll-section {
            position: relative;
            z-index: 1;
            padding: 40px 0 60px;
            border-top: 1px solid var(--border);
        }
        .scroll-section .container {
            max-width: 900px;
        }
        .scroll-section .label {
            font-size: 0.6rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 16px;
            display: block;
            text-align: center;
        }

        .scroll-log {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px 28px;
            max-height: 260px;
            overflow-y: auto;
            font-family: 'Georgia', serif;
            font-size: 0.9rem;
            color: var(--muted);
            line-height: 1.8;
            letter-spacing: 0.02em;
        }
        .scroll-log p {
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        .scroll-log p:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .scroll-log .timestamp {
            color: var(--gold);
            font-size: 0.7rem;
            font-family: var(--font);
            letter-spacing: 0.06em;
            margin-right: 12px;
        }

        /* ===== 谜题网格 ===== */
        .puzzle-section {
            position: relative;
            z-index: 1;
            padding: 60px 0 80px;
            border-top: 1px solid var(--border);
        }
        .puzzle-section .container {
            max-width: 1100px;
        }
        .puzzle-section .label {
            font-size: 0.6rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 16px;
            display: block;
            text-align: center;
        }

        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }

        .puzzle-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 20px;
            text-align: center;
            transition: 0.4s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            user-select: none;
        }
        .puzzle-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0;
            transition: opacity 0.5s;
        }
        .puzzle-card:hover, .puzzle-card:focus {
            transform: translateY(-6px);
            border-color: rgba(217, 198, 169, 0.3);
            outline: none;
        }
        .puzzle-card:hover::before, .puzzle-card:focus::before {
            opacity: 1;
        }
        .puzzle-card .emoji {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 10px;
            opacity: 0.7;
        }
        .puzzle-card .hint {
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 300;
            line-height: 1.6;
        }
        .puzzle-card .tag {
            display: inline-block;
            margin-top: 12px;
            padding: 2px 14px;
            border-radius: 40px;
            border: 1px solid var(--border);
            font-size: 0.5rem;
            color: var(--muted);
            letter-spacing: 0.08em;
        }

        /* ===== 页脚 ===== */
        .footer {
            border-top: 1px solid var(--border);
            padding: 40px 0 28px;
            text-align: center;
            margin-top: auto;
        }
        .footer .links {
            display: flex;
            gap: 36px;
            justify-content: center;
            flex-wrap: wrap;
            list-style: none;
            margin-bottom: 16px;
        }
        .footer .links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            transition: color 0.3s;
        }
        .footer .links a:hover {
            color: #fff;
        }
        .footer .note {
            color: var(--muted);
            font-size: 0.6rem;
            opacity: 0.25;
            letter-spacing: 0.12em;
        }

        .toast-container {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            background: rgba(11, 13, 21, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 60px;
            padding: 12px 36px;
            color: #fff;
            font-size: 0.8rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: translateY(20px) scale(0.96);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: auto;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        @media (max-width: 768px) {
            .container { padding: 0 20px; }
            .navbar { padding: 6px 20px; gap: 20px; top: 16px; width: calc(100% - 32px); border-radius: 40px; }
            .nav-links { gap: 16px; }
            .nav-links a { font-size: 0.6rem; }
            .main-404 { padding: 120px 20px 40px; min-height: 60vh; }
            .puzzle-grid { grid-template-columns: 1fr 1fr; gap: 16px; }
            .btn { padding: 12px 28px; font-size: 0.7rem; }
            .main-404 .code { font-size: 5rem; }
            .scroll-log { max-height: 180px; font-size: 0.8rem; padding: 24px 20px; }
        }

        @media (max-width: 480px) {
            .puzzle-grid { grid-template-columns: 1fr; }
            .main-404 .code { font-size: 3.8rem; }
            .main-404 .title { font-size: 1.6rem; }
            .coordinates { font-size: 0.7rem; padding: 6px 16px; }
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.9s cubic-bezier(0.23, 1, 0.32, 1),
                        transform 0.9s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .reveal-delay-1 { transition-delay: 0.08s; }
        .reveal-delay-2 { transition-delay: 0.16s; }
        .reveal-delay-3 { transition-delay: 0.24s; }
        .reveal-delay-4 { transition-delay: 0.32s; }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>
    <canvas id="flowField"></canvas>
    <div class="toast-container" id="toastContainer"></div>

    <nav class="navbar">
        <a href="https://GodGun-Project.github.io/index.html" class="logo">◈ <span>星尘</span>经纬</a>
        <ul class="nav-links">
            <li><a href="https://GodGun-Project.github.io/index.html">首页</a></li>
            <li><a href="about.html">关于</a></li>
        </ul>
    </nav>

    <main class="main-404">
        <div class="code">404</div>
        <h1 class="title reveal">裂隙 · 路径未明</h1>
        <p class="desc reveal reveal-delay-1">
            你已踏入 <mark>未标注的回廊</mark>，这里没有地图，只有星尘的低语。
        </p>
        <div class="coordinates reveal reveal-delay-2" id="coordDisplay" tabindex="0" role="button" aria-label="刷新坐标">◈ 虚数坐标 · 生成中</div>
        <div class="btn-group reveal reveal-delay-3">
            <a href="https://GodGun-Project.github.io/index.html" class="btn btn-primary">◈ 返回主廊</a>
            <button class="btn btn-secondary" id="randomGuide">🌀 随机指引</button>
            <button class="btn btn-echo" id="echoBtn">◈ 聆听虚空</button>
        </div>
    </main>

    <!-- ===== 迷失之卷 ===== -->
    <section class="scroll-section">
        <div class="container">
            <span class="label reveal">迷 失 之 卷</span>
            <div class="scroll-log reveal" id="scrollLog">
                <!-- 由 JS 动态填充 -->
            </div>
        </div>
    </section>

    <!-- ===== 谜题区块 ===== -->
    <section class="puzzle-section">
        <div class="container">
            <span class="label reveal">虚 空 迷 题</span>
            <div class="puzzle-grid" id="puzzleGrid">
                <!-- 由 JS 生成 -->
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <ul class="links">
                <li><a href="https://GodGun-Project.github.io/index.html">首页</a></li>
                <li><a href="about.html">关于</a></li>
                <li><a href="#">虚空地图</a></li>
            </ul>
            <p class="note">星尘经纬 · 迷失回廊</p>
        </div>
    </footer>

    <script>
        (function() {
            'use strict';

            let isPageActive = true;
            document.addEventListener('visibilitychange', () => {
                isPageActive = !document.hidden;
            });

            // ===== Toast =====
            const toastContainer = document.getElementById('toastContainer');

            function showToast(msg, duration) {
                duration = duration || 2000;
                const t = document.createElement('div');
                t.className = 'toast';
                t.textContent = msg;
                toastContainer.appendChild(t);
                requestAnimationFrame(() => t.classList.add('show'));
                setTimeout(() => {
                    t.classList.remove('show');
                    setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 400);
                }, duration);
            }

            // ===== 粒子背景 =====
            (function initParticles() {
                const c = document.getElementById('particles');
                const ctx = c.getContext('2d');
                let w, h, particles = [];
                const COUNT = 120;

                function resize() {
                    w = window.innerWidth;
                    h = window.innerHeight;
                    c.width = w;
                    c.height = h;
                }

                function create() {
                    particles = [];
                    for (let i = 0; i < COUNT; i++) {
                        particles.push({
                            x: Math.random() * w,
                            y: Math.random() * h,
                            r: 1 + Math.random() * 2.5,
                            dx: (Math.random() - 0.5) * 0.3,
                            dy: (Math.random() - 0.5) * 0.3,
                            a: 0.15 + Math.random() * 0.4
                        });
                    }
                }

                function draw() {
                    if (isPageActive) {
                        ctx.clearRect(0, 0, w, h);
                        for (let i = 0; i < particles.length; i++) {
                            for (let j = i + 1; j < particles.length; j++) {
                                const dx = particles[i].x - particles[j].x;
                                const dy = particles[i].y - particles[j].y;
                                const dist = Math.sqrt(dx * dx + dy * dy);
                                if (dist < 140) {
                                    ctx.beginPath();
                                    ctx.moveTo(particles[i].x, particles[i].y);
                                    ctx.lineTo(particles[j].x, particles[j].y);
                                    ctx.strokeStyle = `rgba(217,198,169,${0.04 * (1 - dist / 140)})`;
                                    ctx.lineWidth = 0.5;
                                    ctx.stroke();
                                }
                            }
                        }
                        for (const p of particles) {
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                            const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 2);
                            grad.addColorStop(0, `rgba(217,198,169,${p.a * 0.6})`);
                            grad.addColorStop(1, 'rgba(217,198,169,0)');
                            ctx.fillStyle = grad;
                            ctx.fill();

                            p.x += p.dx;
                            p.y += p.dy;
                            if (p.x < 0 || p.x > w) p.dx *= -1;
                            if (p.y < 0 || p.y > h) p.dy *= -1;
                        }
                    }
                    requestAnimationFrame(draw);
                }

                resize();
                create();
                draw();
                window.addEventListener('resize', () => { resize(); create(); });
            })();

            // ===== 流动场 =====
            (function initFlowField() {
                const c = document.getElementById('flowField');
                const ctx = c.getContext('2d');
                let w, h, dots = [];

                function resize() {
                    w = window.innerWidth;
                    h = window.innerHeight;
                    c.width = w;
                    c.height = h;
                }

                function createDots() {
                    dots = [];
                    for (let i = 0; i < 60; i++) {
                        dots.push({
                            x: Math.random() * w,
                            y: Math.random() * h,
                            size: 1.5 + Math.random() * 2,
                            speedX: (Math.random() - 0.5) * 0.3,
                            speedY: (Math.random() - 0.5) * 0.3,
                            opacity: 0.1 + Math.random() * 0.2
                        });
                    }
                }

                function draw() {
                    if (isPageActive) {
                        ctx.clearRect(0, 0, w, h);
                        for (const d of dots) {
                            d.x += d.speedX;
                            d.y += d.speedY;
                            if (d.x < 0 || d.x > w) d.speedX *= -1;
                            if (d.y < 0 || d.y > h) d.speedY *= -1;
                            ctx.beginPath();
                            ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
                            ctx.fillStyle = `rgba(140,212,232,${d.opacity})`;
                            ctx.fill();
                        }
                    }
                    requestAnimationFrame(draw);
                }

                resize();
                createDots();
                draw();
                window.addEventListener('resize', () => { resize(); createDots(); });
            })();

            // ===== 坐标生成器 =====
            const coordEl = document.getElementById('coordDisplay');

            function generateCoord() {
                const parts = [
                    '0x' + Math.random().toString(16).substring(2, 8),
                    'θ' + (Math.random() * 360).toFixed(2) + '°',
                    'λ' + (Math.random() * 180 - 90).toFixed(2) + '°',
                    't' + (Math.random() * 1e10).toFixed(0)
                ];
                return '◈ ' + parts.join(' · ');
            }

            function updateCoord() {
                coordEl.textContent = generateCoord();
            }
            updateCoord();
            setInterval(updateCoord, 8000);

            function triggerCoordRefresh() {
                updateCoord();
                showToast('⟡ 坐标已刷新');
            }

            coordEl.addEventListener('click', triggerCoordRefresh);
            coordEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    triggerCoordRefresh();
                }
            });

            // ===== 迷失之卷 =====
            const logData = [
                { time: '00:00:00', text: '进入未标注回廊，信号微弱。' },
                { time: '00:02:17', text: '检测到背景辐射异常，疑似路径残留。' },
                { time: '00:05:43', text: '光尘开始聚集，形成模糊的指向。' },
                { time: '00:09:12', text: '坐标系统失效，仅能依赖恒星视差。' },
                { time: '00:14:55', text: '回廊出现分叉，左侧有微弱脉动。' },
                { time: '00:21:08', text: '脉动频率与已知信号库匹配失败。' },
                { time: '00:28:33', text: '决定继续前进，记录每一帧星尘。' },
                { time: '00:36:47', text: '前方出现暗色裂隙，似乎通向另一层。' }
            ];

            const scrollLog = document.getElementById('scrollLog');
            scrollLog.innerHTML = '';
            logData.forEach(entry => {
                const p = document.createElement('p');
                p.innerHTML = `<span class="timestamp">${entry.time}</span> ${entry.text}`;
                scrollLog.appendChild(p);
            });

            // ===== 谜题数据 =====
            const puzzleData = [
                { emoji: '⟡', text: '光在折角处弯曲，指向未知的维度。', tag: '折射' },
                { emoji: '◈', text: '虚数之海的潮汐，隐含着路径的韵律。', tag: '潮汐' },
                { emoji: '⌇', text: '静默的频率中，藏着下一个节点的坐标。', tag: '频率' },
                { emoji: '∞', text: '递归的镜像，每一次映射都更接近出口。', tag: '递归' },
                { emoji: '✤', text: '螺旋的索引，沿着它可溯回源点。', tag: '螺旋' },
                { emoji: '⌾', text: '奇点的引力，将散落的线索聚集。', tag: '奇点' },
                { emoji: '⊚', text: '双面的镜像，每一面都映出不同的路径。', tag: '镜像' },
                { emoji: '⏣', text: '时态的折痕，在这里过去与未来重叠。', tag: '时态' },
                { emoji: '☍', text: '空间的介词，连接着不连续的片段。', tag: '连接' },
                { emoji: '⨁', text: '合成的算子，将零散的信息整合为指引。', tag: '合成' }
            ];

            const puzzleGrid = document.getElementById('puzzleGrid');
            puzzleGrid.innerHTML = '';
            puzzleData.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = `puzzle-card reveal reveal-delay-${(idx % 4) + 1}`;
                div.setAttribute('tabindex', '0');
                div.setAttribute('role', 'button');
                div.setAttribute('aria-label', `解开谜题：${item.tag}`);
                div.innerHTML = `
                    <span class="emoji">${item.emoji}</span>
                    <div class="hint">${item.text}</div>
                    <span class="tag">${item.tag}</span>
                `;
                
                const handleInteraction = () => {
                    const msgs = [
                        `✦ 触摸 · ${item.tag}`,
                        `◈ 解读 · ${item.tag}`,
                        `⌇ 共鸣 · ${item.tag}`
                    ];
                    showToast(msgs[Math.floor(Math.random() * msgs.length)]);
                };

                div.addEventListener('click', handleInteraction);
                div.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        handleInteraction();
                    }
                });
                puzzleGrid.appendChild(div);
            });

            // ===== 按钮交互 =====
            document.getElementById('randomGuide').addEventListener('click', function() {
                const clues = [
                    '🌀 跟随光尘，它们会引向最近的回廊。',
                    '✨ 闭上眼睛，虚空会显现隐形的路径。',
                    '⌇ 聆听背景音，那里藏着方向的频率。',
                    '∞ 尝试反向行走，也许出口就在身后。',
                    '⟡ 折角处的阴影，往往指向光明。',
                    '◈ 在虚数之海投下一颗石子，观察涟漪。',
                    '⏣ 折痕处可能埋藏着时间的捷径。'
                ];
                const msg = clues[Math.floor(Math.random() * clues.length)];
                showToast(msg);
            });

            // ===== Web Audio 模拟低频共鸣 =====
            let audioCtx = null;
            document.getElementById('echoBtn').addEventListener('click', function() {
                try {
                    if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = 120 + Math.random() * 180;
                    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.8);
                    showToast('◈ 虚空回声 · 低频颤动');
                } catch (_) {
                    showToast('◈ 虚空沉寂 · 无法共鸣');
                }
            });

            // ===== 导航链接小提示 =====
            document.querySelectorAll('.nav-links a, .footer .links a').forEach(link => {
                link.addEventListener('click', function(e) {
                    const href = this.getAttribute('href');
                    if (href && href.startsWith('#')) {
                        e.preventDefault();
                    }
                    if (href && (href.includes('index') || href.includes('about'))) {
                        showToast(`↗ 导航至 ${this.textContent.trim()}`, 1000);
                    }
                });
            });

            // ===== 入场滚动显示动画 =====
            (function initReveal() {
                const els = document.querySelectorAll('.reveal');
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(e => {
                        if (e.isIntersecting) e.target.classList.add('visible');
                    });
                }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
                
                els.forEach(el => observer.observe(el));
                setTimeout(() => {
                    els.forEach(el => {
                        if (el.getBoundingClientRect().top < window.innerHeight - 40)
                            el.classList.add('visible');
                    });
                }, 100);
            })();

            console.log('✦ 404 · 虚空裂隙 已升级');
            console.log('◈ 已优化：流动场、后台渲染暂停、AudioContext 策略与无障碍支持');
        })();
    </script>
</body>
</html>
